name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by hand (Actions, CI, Run workflow) before an ultracode review: checks everything.
  workflow_dispatch:

# One run per PR push; a newer push cancels the run it replaces. Runs on main (a merge, or a full run started by hand)
# are never cancelled, so each one's result can be read.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # A pull request only builds and tests the crates it changes (Solomon, 2026-10-31), and clippy checks every crate
  # that uses them; a push to main, or a run started by hand, checks everything. tools/dev/ci_scope.py decides.
  scope:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.scope.outputs.test }}
      check: ${{ steps.scope.outputs.check }}
      rust: ${{ steps.scope.outputs.rust }}
      ui: ${{ steps.scope.outputs.ui }}
      formats: ${{ steps.scope.outputs.formats }}
      galaxy: ${{ steps.scope.outputs.galaxy }}
      launcher: ${{ steps.scope.outputs.launcher }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --no-renames "origin/$BASE...HEAD" | python3 tools/dev/ci_scope.py
          else
            python3 tools/dev/ci_scope.py --full < /dev/null
          fi

  check:
    name: ${{ matrix.os }}
    needs: scope
    # Runs even when the scope job failed, and then fails itself, so a broken scope never shows as skipped (green).
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Stop if working out what changed failed
        if: needs.scope.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The galaxy check is a workspace of its own with its own target folder: cache both, or Windows builds wgpu
      # from scratch every time (about 17 of its 20 minutes).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tools/galaxycheck -> target
      - name: Linux libraries for the window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libasound2-dev
      - name: Launcher scripts parse in Windows PowerShell 5.1
        if: runner.os == 'Windows' && needs.scope.outputs.launcher == 'true'
        shell: powershell
        run: |
          $errors = $null
          foreach ($script in 'run-latest.ps1', 'twin-test.ps1') {
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD\tools\dev\$script", [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
          }
      - name: Format
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          cargo fmt --all --check --manifest-path tools/galaxycheck/Cargo.toml
      - name: Clippy
        if: needs.scope.outputs.rust == 'true'
        run: cargo clippy ${{ needs.scope.outputs.check }} --all-targets
      # Linux also runs the tests of every crate that uses a changed one; Windows and Mac only the changed crates'.
      - name: Tests
        if: needs.scope.outputs.test != '' && runner.os != 'Linux'
        run: cargo test ${{ needs.scope.outputs.test }}
      - name: Tests (and the crates that use them)
        if: needs.scope.outputs.rust == 'true' && runner.os == 'Linux'
        run: cargo test ${{ needs.scope.outputs.check }}
      # The galaxy check is a workspace of its own (so its wgpu stays out of the app); checked on Windows, where it runs.
      - name: Galaxy check clippy
        if: runner.os == 'Windows' && needs.scope.outputs.galaxy == 'true'
        working-directory: tools/galaxycheck
        run: cargo clippy --all-targets
      - name: Galaxy check tests
        if: runner.os == 'Windows' && needs.scope.outputs.galaxy == 'true'
        working-directory: tools/galaxycheck
        run: cargo test

  # Every library the app uses (deny.toml): no known security holes, only licences that let the app be shared, and
  # only from crates.io. The galaxy check's libraries too.
  deny:
    name: Libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: tools/galaxycheck/Cargo.toml

  screenshots:
    name: Screenshots
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.ui == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Stop if working out what changed failed
        if: needs.scope.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libasound2-dev
      - name: Draw every page
        run: cargo run --bin mo-screens -- screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png

  # The twin test (spec 11.2): the C# app's readers, built from Silkie86/Music-Organiser, and the Rust ones read the
  # test files; any difference not already judged in crates/mo-formats/DIFFERENCES.md (tools/twin/expected.txt) fails.
  twin:
    name: Twin test
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.formats == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Stop if working out what changed failed
        if: needs.scope.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Silkie86/Music-Organiser
          # The C# app as the Rust readers were last measured against; moved on purpose, with expected.txt.
          ref: 4515ce8533eabff9669719d784834f0d1f77d59a
          path: old
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Write the test files
        run: MO_TWIN_FIXTURES="$RUNNER_TEMP/twin" cargo test -p mo-formats --test twin_fixtures
      - name: Build the C# half
        run: >
          dotnet build tools/twin/cs -c Release -o "$RUNNER_TEMP/twin-cs" -p:MoOldRepo="$GITHUB_WORKSPACE/old"
          -p:MoBuildNative=false -p:MoBuildBitwig=false
      - name: Both apps read the test files
        run: cargo run -p mo-twin -- run --cs "$RUNNER_TEMP/twin-cs/twin-cs.dll" "$RUNNER_TEMP/twin" --expect tools/twin/expected.txt
      # The sound analysers: test sounds made by the twin tool (none is anyone's sample), analysed by both apps.
      - name: Both apps analyse the test sounds
        run: cargo run -p mo-twin -- sounds --cs "$RUNNER_TEMP/twin-cs/twin-cs.dll" "$RUNNER_TEMP"

  # The scripts that run inside the DAWs (rule 11: plain ASCII; tests never reach a real DAW). Cheap, so always run.
  daw-scripts:
    name: DAW scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FL Studio link parses as FL Studio's Python 3.9 and passes its tests
        run: |
          python -c "import ast, sys; ast.parse(open(sys.argv[1], encoding='utf-8').read(), feature_version=(3, 9))" extensions/fl-studio/device_MusicOrganiser.py
          python -m unittest discover -s extensions/fl-studio/test -v
      - name: Bitwig scripts parse and are plain ASCII
        run: |
          for f in tools/formatlab/daw/bitwig/*.js; do node --check "$f"; done
          # grep finds nothing (1) is the pass; a missing file (2) fails too.
          set +e
          LC_ALL=C grep -nP '[^\x00-\x7F]' tools/formatlab/daw/bitwig/*.js extensions/fl-studio/device_MusicOrganiser.py
          test $? -eq 1
