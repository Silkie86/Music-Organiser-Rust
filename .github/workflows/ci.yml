name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by hand (Actions, CI, Run workflow) before an ultracode review: checks everything.
  workflow_dispatch:

# One run per PR push; a newer push cancels the run it replaces. A run on main (a merge, or a full run started by hand)
# that has started is never cancelled, so its result can be read; one still waiting for it is replaced by a newer
# merge's (GitHub keeps one waiting run per group).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: no job here writes to the repository (review UP-15).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # A pull request only builds and tests the crates it changes (Solomon, 2026-10-31), and clippy checks every crate
  # that uses them; a push to main, or a run started by hand, checks everything. tools/dev/ci_scope.py decides.
  scope:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      test: ${{ steps.scope.outputs.test }}
      check: ${{ steps.scope.outputs.check }}
      rust: ${{ steps.scope.outputs.rust }}
      ui: ${{ steps.scope.outputs.ui }}
      formats: ${{ steps.scope.outputs.formats }}
      galaxy: ${{ steps.scope.outputs.galaxy }}
      launcher: ${{ steps.scope.outputs.launcher }}
      installer: ${{ steps.scope.outputs.installer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --no-renames "origin/$BASE...HEAD" | python3 tools/dev/ci_scope.py
          else
            python3 tools/dev/ci_scope.py --full < /dev/null
          fi

  check:
    name: ${{ matrix.os }}
    needs: scope
    # Runs even when the scope job failed, and then fails itself, so a broken scope never shows as skipped (green).
    if: ${{ !cancelled() }}
    # Mac runs on main only (Solomon, 2026-11-25). It was advice only on pull requests (2026-11-05), but a PR's run
    # still ended only when Mac did: GitHub's Mac machines took 35-50 minutes where Windows and Linux took 15-20, and
    # sometimes had no machine at all. On main Mac still counts; a Mac failure there is fixed at once.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["windows-latest", "ubuntu-latest"]') || fromJSON('["windows-latest", "macos-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    # A hung test fails within the hour rather than at GitHub's 6 (review TC-1).
    timeout-minutes: 60
    steps:
      - name: Stop if working out what changed failed
        if: needs.scope.result != 'success'
        run: exit 1
      # Windows Defender looked at every file the build wrote (thousands of them, each test binary tens of MB).
      - name: Windows Defender leaves the build folders alone
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # the stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Rust's own linker on Windows, much quicker than Microsoft's link.exe at linking the 50-odd test binaries. Set
      # before the cache step so the cached libraries are built with it (a change of linker rebuilds every library with
      # a build script). Only for the checks: the installer job and the releases keep link.exe.
      - name: Link with Rust's own linker on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld" >> "$GITHUB_ENV"
      # Only main saves the cache (every PR starts from main's): a PR's own cache is no use to any other PR, saving it
      # took Windows about 4 minutes at the end of each run, and PR caches pushed main's out of GitHub's 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Linux libraries for the window
        if: runner.os == 'Linux'
        run: |
          # GitHub's machines sometimes can't find Ubuntu's download servers for a while: tried again, a few times.
          for try in 1 2 3 4; do
            sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=3 libfontconfig1-dev libxkbcommon-dev libwayland-dev libasound2-dev && exit 0
            sleep 30
          done
          exit 1
      - name: Launcher scripts parse in Windows PowerShell 5.1
        if: runner.os == 'Windows' && needs.scope.outputs.launcher == 'true'
        shell: powershell
        run: |
          $errors = $null
          foreach ($script in 'run-latest.ps1', 'twin-test.ps1') {
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD\tools\dev\$script", [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
          }
      - name: Format
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          cargo fmt --all --check --manifest-path tools/galaxycheck/Cargo.toml
          cargo fmt --all --check --manifest-path fuzz/Cargo.toml
      # An out-of-date Cargo.lock fails here, with Cargo's own words, not first in the release's locked build (TC-2).
      - name: Cargo.lock is up to date
        if: runner.os == 'Linux'
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path tools/galaxycheck/Cargo.toml > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null
      - name: Clippy
        if: needs.scope.outputs.rust == 'true'
        run: cargo clippy ${{ needs.scope.outputs.check }} --all-targets
      # The fuzzer's targets (fuzz/README.md) still build after a reader changes: they run by hand with nightly Rust, so
      # nothing else would notice. Checked with the app's own build folder, which has most of what they use.
      - name: Fuzz targets still build
        if: needs.scope.outputs.rust == 'true' && runner.os == 'Linux'
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins --target-dir target
      # Linux also runs the tests of every crate that uses a changed one; Windows and Mac only the changed crates'.
      - name: Tests
        if: needs.scope.outputs.test != '' && runner.os != 'Linux'
        run: cargo test ${{ needs.scope.outputs.test }}
      - name: Tests (and the crates that use them)
        if: needs.scope.outputs.rust == 'true' && runner.os == 'Linux'
        run: cargo test ${{ needs.scope.outputs.check }}

  # The galaxy check is a workspace of its own (so its wgpu stays out of the app); checked on Windows, where it runs.
  # A job of its own so it runs beside the Windows tests instead of after them (it added about 5 minutes to Windows).
  galaxy:
    name: Galaxy check
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.galaxy == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Stop if working out what changed failed
        if: needs.scope.result != 'success'
        run: exit 1
      # Windows Defender looked at every file the build wrote (thousands of them, each test binary tens of MB).
      - name: Windows Defender leaves the build folders alone
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # the stable branch
        with:
          toolchain: stable
          components: clippy
      # Its own target folder: without the cache Windows builds wgpu from scratch every time.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/galaxycheck -> target
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Galaxy check clippy
        working-directory: tools/galaxycheck
        run: cargo clippy --all-targets
      - name: Galaxy check tests
        working-directory: tools/galaxycheck
        run: cargo test

  # The Windows installer (installer/, docs/installer.md): the setup .exe is built from a plain debug build (quick, and
  # the installer doesn't care which) and tried by installer/check.ps1 on GitHub's machine: a new PC, a picked data
  # folder, a PC with data, an update and an uninstall. The setup is kept as a download.
  installer:
    name: Installer
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.installer == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Stop if working out what changed failed
        if: needs.scope.result != 'success'
        run: exit 1
      # Windows Defender looked at every file the build wrote (thousands of them, each test binary tens of MB).
      - name: Windows Defender leaves the build folders alone
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # the stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the app
        run: cargo build -p mo-ui --bin music-organiser
      - name: Build the setup
        shell: pwsh
        run: |
          # A stand-in for the CLAP plugin (the release builds the real one): only where it goes is tried here.
          Set-Content -LiteralPath stand-in.clap -Value 'not a plugin' -Encoding ascii
          $setup = installer\build.ps1 -Exe target\debug\music-organiser.exe -ClapPlugin stand-in.clap -Out dist
          "SETUP=$setup" >> $env:GITHUB_ENV
      - name: Try the setup
        shell: pwsh
        run: installer\check.ps1 -Setup $env:SETUP
      - name: The scripts parse in Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($f in 'installer\build.ps1', 'installer\check.ps1') {
            $errors = $null
            [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw $f), [ref]$errors) | Out-Null
            if ($errors) { $errors; exit 1 }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setup
          path: dist/*.exe

  # Every library the app uses (deny.toml): no known security holes, only licences that let the app be shared, and
  # only from crates.io. The galaxy check's libraries too.
  deny:
    name: Libraries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          manifest-path: tools/galaxycheck/Cargo.toml

  screenshots:
    name: Screenshots
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.ui == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Stop if working out what changed failed
        if: needs.scope.result != 'success'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # the stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Linux libraries for the window
        run: |
          # GitHub's machines sometimes can't find Ubuntu's download servers for a while: tried again, a few times.
          for try in 1 2 3 4; do
            sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=3 libfontconfig1-dev libxkbcommon-dev libwayland-dev libasound2-dev && exit 0
            sleep 30
          done
          exit 1
      - name: Draw every page
        run: cargo run --bin mo-screens -- screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots
          path: screenshots/*.png

  # The twin test (spec 11.2): the C# app's readers, built from Silkie86/Music-Organiser, and the Rust ones read the
  # test files; any difference not already judged in crates/mo-formats/DIFFERENCES.md (tools/twin/expected.txt) fails.
  twin:
    name: Twin test
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.formats == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Stop if working out what changed failed
        if: needs.scope.result != 'success'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Silkie86/Music-Organiser
          # The C# app as the Rust readers were last measured against; moved on purpose, with expected.txt.
          ref: 4515ce8533eabff9669719d784834f0d1f77d59a
          path: old
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # the stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Write the test files
        run: MO_TWIN_FIXTURES="$RUNNER_TEMP/twin" cargo test -p mo-formats --test twin_fixtures
      - name: Build the C# half
        run: >
          dotnet build tools/twin/cs -c Release -o "$RUNNER_TEMP/twin-cs" -p:MoOldRepo="$GITHUB_WORKSPACE/old"
          -p:MoBuildNative=false -p:MoBuildBitwig=false
      - name: Both apps read the test files
        run: cargo run -p mo-twin -- run --cs "$RUNNER_TEMP/twin-cs/twin-cs.dll" "$RUNNER_TEMP/twin" --expect tools/twin/expected.txt
      # The sound analysers: test sounds made by the twin tool (none is anyone's sample), analysed by both apps.
      - name: Both apps analyse the test sounds
        run: cargo run -p mo-twin -- sounds --cs "$RUNNER_TEMP/twin-cs/twin-cs.dll" "$RUNNER_TEMP"

  # The scripts that run inside the DAWs (rule 11: plain ASCII; tests never reach a real DAW). Cheap, so always run.
  daw-scripts:
    name: DAW scripts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: FL Studio link parses as FL Studio's Python 3.9 and passes its tests
        run: |
          python -c "import ast, sys; ast.parse(open(sys.argv[1], encoding='utf-8').read(), feature_version=(3, 9))" extensions/fl-studio/device_DAWmate.py
          python -m unittest discover -s extensions/fl-studio/test -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Bitwig script passes its checks
        working-directory: extensions/bitwig
        run: |
          npm ci
          npm test
      - name: Bitwig scripts parse and are plain ASCII
        run: |
          for f in tools/formatlab/daw/bitwig/*.js extensions/bitwig/MusicOrganiser.control.js; do node --check "$f"; done
          # grep finds nothing (1) is the pass; a missing file (2) fails too.
          set +e
          LC_ALL=C grep -nP '[^\x00-\x7F]' tools/formatlab/daw/bitwig/*.js extensions/bitwig/MusicOrganiser.control.js \
            extensions/bitwig-java/src/main/java/org/musicorganiser/bitwig/*.java extensions/fl-studio/device_DAWmate.py
          test $? -eq 1

  # The Bitwig extension (Java), moved here from the C# repo: built and tested with Maven, which gets Bitwig's API from
  # Bitwig's own repository (maven.bitwig.com; nothing of Bitwig's is kept here). Each run keeps
  # DAWmate.bwextension as a download. Cheap enough to always run.
  bitwig-extension:
    name: Bitwig extension
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: extensions/bitwig-java/pom.xml
      # For ParityTest, which runs the JavaScript script beside the extension and compares their answers.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build and test
        working-directory: extensions/bitwig-java
        run: mvn -B package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dawmate-bitwig-extension
          path: extensions/bitwig-java/target/DAWmate.bwextension
          if-no-files-found: error
