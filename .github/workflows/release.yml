name: Release

# A release starts from a version tag on main, like v1.0.0, or from Run workflow on main with "Make the draft release"
# ticked, which tags it itself (docs/installer.md). GitHub builds the Bitwig extension and
# the app (dist profile), makes the setup .exe, tries it (installer/check.ps1), and puts a DRAFT release on the
# Releases page with the setup and its SHA-256. Nothing is public until Solomon publishes the draft.
# The tag must match the workspace version in Cargo.toml (v1.0.0 for 1.0.0), so the app's version and the setup agree.

on:
  push:
    tags: ["v*"]
  # Run workflow (Actions, Release): a try-out from any branch, everything but the release itself, with the setup kept
  # as a download; or, ticked and on main, the draft release too, its tag made from Cargo.toml's version.
  workflow_dispatch:
    inputs:
      release:
        description: Make the draft release (main only; the tag is v plus Cargo.toml's version)
        type: boolean
        default: false

# Read-only everywhere; only the job that drafts the release may write.
permissions:
  contents: read

concurrency:
  # Every run that makes a release waits for the one before (a ticked Run workflow and a tag push of the same version
  # can't both make a draft); try-outs only wait for their own branch.
  group: release-${{ (github.event_name == 'push' || inputs.release) && 'release' || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Before anything is built: a release must be a commit on main whose full CI run (main's push run) passed, and match the
  # app's version, so a release is always code that went through review and CI, and the app and its setup say the same
  # version (UP-13).
  tag:
    name: Tag
    runs-on: ubuntu-latest
    # Reads how main's CI went for this commit.
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      published: ${{ steps.published.outputs.published }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The version, and for a release that it's on main and matches the tag
        id: tag
        env:
          RELEASE: ${{ github.event_name == 'push' || inputs.release }}
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$version" ] || { echo "Cargo.toml has no workspace version"; exit 1; }
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          [ "$RELEASE" = "true" ] || exit 0
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not a commit on main"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "the tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $version: raise the version first"; exit 1; }
          else
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "a release is made from main only, not $GITHUB_REF_NAME"; exit 1; }
            # A tag of this version made before (by hand, say) would hold the draft instead of this commit.
            at=$(git rev-parse -q --verify "refs/tags/v$version^{commit}" || true)
            [ -z "$at" ] || [ "$at" = "$GITHUB_SHA" ] || { echo "v$version is a tag at $at already, not this commit: raise the version first"; exit 1; }
          fi
      # Publishing a draft made by Run workflow makes its tag, and that tag starts this workflow again: nothing to do.
      # A ticked Run workflow for a version that's out already stops here, before anything is built.
      - name: Whether this version's release is out already
        id: published
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # This address lists published releases only, never drafts: not found means not out yet.
          if answer=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .tag_name 2>&1); then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "$TAG is published already: nothing to build"
              echo "published=true" >> "$GITHUB_OUTPUT"
            else
              echo "$TAG is published already: raise the version in Cargo.toml first"; exit 1
            fi
          elif ! echo "$answer" | grep -q "HTTP 404"; then
            echo "couldn't ask GitHub whether $TAG is out: $answer"; exit 1
          fi
      # main's own CI for this commit (a PR's run tests only what it changed; main's checks everything) must have
      # passed: its push run, or a full run started by hand. A run still going, cancelled by a later merge or failed
      # stops it here. Not asked once the release is out (the tag a published draft makes starts this again).
      - name: main's CI passed for this commit
        if: (github.event_name == 'push' || inputs.release) && steps.published.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          runs=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch main --limit 20 \
            --json status,conclusion,event --jq '[.[] | "\(.event) \(.status) \(.conclusion)"] | join(", ")')
          if ! gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch main --limit 20 --json conclusion \
            --jq '[.[] | select(.conclusion == "success")] | length' | grep -qv '^0$'; then
            echo "main's CI for $GITHUB_SHA hasn't passed (${runs:-no run at all})."
            echo "Wait for it, or fix it; if it was cancelled or never ran, start Actions, CI, Run workflow on main (when this"
            echo "commit is main's newest), and run Release again once that's green."
            exit 1
          fi

  bitwig-extension:
    name: Bitwig extension
    needs: tag
    if: needs.tag.outputs.published != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: extensions/bitwig-java/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build and test
        working-directory: extensions/bitwig-java
        run: mvn -B package
      # Whatever the extension is called (its name is the DAW links', not this workflow's).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bitwig-extension
          path: extensions/bitwig-java/target/*.bwextension
          if-no-files-found: error

  setup:
    name: Setup
    needs: bitwig-extension
    runs-on: windows-latest
    steps:
      # The whole history, so the app's build number can be counted (crates/mo-app/build.rs counts only in a clone that
      # isn't shallow): the released app's version line says "build N", as the launcher's builds do (review IN-3).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # the stable branch
        with:
          toolchain: stable
      # The dist build's own cache, saved by tag runs, so a release rebuilds only what changed.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dist
          save-if: ${{ github.event_name == 'push' || inputs.release }}
      - name: Build the app (dist)
        # --locked: exactly the libraries Cargo.lock names, the ones CI tested.
        run: cargo build --locked --profile dist -p mo-ui --bin music-organiser
      - name: Build the CLAP plugin (dist)
        run: cargo build --locked --profile dist -p mo-plugin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bitwig-extension
          path: bitwig
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the setup
        shell: pwsh
        run: |
          $ext = Get-ChildItem bitwig -Filter *.bwextension | Select-Object -First 1
          if (-not $ext) { throw 'no Bitwig extension came from the first job' }
          $setup = installer\build.ps1 -Exe target\dist\music-organiser.exe -BitwigExtension $ext.FullName `
            -ClapPlugin target\dist\mo_plugin.dll -Out dist
          "SETUP=$setup" >> $env:GITHUB_ENV
      - name: Try the setup
        shell: pwsh
        run: installer\check.ps1 -Setup $env:SETUP
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setup
          path: dist/*.exe

  # The only job that writes: it puts the tried setup on a draft release.
  release:
    name: Draft release
    needs: [tag, setup]
    if: github.event_name == 'push' || inputs.release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: setup
          path: dist
      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          $env:SETUP = (Get-ChildItem dist -Filter *.exe | Select-Object -First 1).FullName
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:SETUP).Hash.ToLower()
          $file = Split-Path -Leaf $env:SETUP
          "$hash  $file" | Set-Content -Encoding ascii -NoNewline "$env:SETUP.sha256"
          $notes = "Download **$file** and run it. Windows may say ""Windows protected your PC"" until the setup is " +
            "signed: click More info, then Run anyway.`n`nSHA-256: ``$hash``"
          # Run again (a re-run, say): the draft that's there gets the new files, never a second draft. A release
          # that's already published is never changed: raise the version for a new one.
          $draft = gh release view $env:TAG --json isDraft --jq .isDraft 2> $null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw "$env:TAG is already published: raise the version in Cargo.toml first" }
            # From Run workflow on a newer main, the draft's tag moves to the commit these files were built from.
            if ($env:GITHUB_EVENT_NAME -ne 'push') {
              gh release edit $env:TAG --target $env:GITHUB_SHA
              if ($LASTEXITCODE -ne 0) { throw "the draft's commit could not be changed" }
            }
            gh release upload $env:TAG $env:SETUP "$env:SETUP.sha256" --clobber
          } else {
            # A version with a dash (0.9.0-beta.1) is a test release, marked so on the page.
            $more = @()
            if ($env:TAG -like '*-*') { $more += '--prerelease' }
            # From a tag push the tag is there already; from Run workflow it's made at this commit when the draft is
            # published.
            if ($env:GITHUB_EVENT_NAME -eq 'push') { $more += '--verify-tag' } else { $more += @('--target', $env:GITHUB_SHA) }
            gh release create $env:TAG $env:SETUP "$env:SETUP.sha256" --draft `
              --title "$env:TAG" --notes $notes @more
          }
          if ($LASTEXITCODE -ne 0) { throw 'the release could not be made' }
