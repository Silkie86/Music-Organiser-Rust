# Tests may unwrap: a test that stops there has failed, which is what it should do.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Every catch of a panic goes through mo-catch, so the crash handler can tell a damaged file that a reader tripped over
# (one warning line) from a crash.
disallowed-methods = [
    { path = "std::panic::catch_unwind", reason = "catch with mo_catch::catch (a panic the app expects, as a damaged file tripping a reader: one warning line) or mo_catch::catch_crash (a bug the thread lives through: still a crash)" },
]
