[package]
name = "mo-twin"
description = "The twin test: reads the same project files with the C# app's readers and the Rust ones (and analyses the same sounds), and lists every difference."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "twin"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
mo-audio = { path = "../../crates/mo-audio", default-features = false }
mo-formats = { path = "../../crates/mo-formats" }
mo-library = { path = "../../crates/mo-library" }
mo-sounds = { path = "../../crates/mo-sounds" }
rayon = "1.10"
thread-priority.workspace = true
# Numbers read back exactly as written (the galaxy twin settles from the C# app's own starting picture).
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
