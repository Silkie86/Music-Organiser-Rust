[package]
name = "mo-backup"
description = "Backup: a lean mirror of your music on another drive. Works out what goes (and what's left out, and why), then copies with a check. Never changes your music folders. No UI in it."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono.workspace = true
mo-formats = { path = "../mo-formats" }
# Sizes, folder walks that leave links alone, and the song Compact list the lean rules come from.
mo-space = { path = "../mo-space" }
rayon.workspace = true
# Each copy is read back and its SHA-256 checked against what was read from your folder.
sha2 = "0.10"
# A song zip's check numbers, to see a file whose time moved is still the same bytes.
crc32fast = "1.5"
# The one-zip-per-song format.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
