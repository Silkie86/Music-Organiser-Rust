[package]
name = "mo-library"
description = "The library of songs: reads the C# app's library.db (read-only until it's trusted) and groups saves into songs. No UI in it."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono.workspace = true
mo-catch = { path = "../mo-catch" }
mo-formats = { path = "../mo-formats" }
rayon.workspace = true
# Hears about file changes from the system (ReadDirectoryChangesW, FSEvents, inotify).
notify = "8.2"
thread-priority.workspace = true
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
# SQLite, built into the app, so nothing has to be installed beside it.
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# songs.db: each save's track details compressed, and the new file checked against library.db row by row.
flate2 = "1"
sha2 = "0.10"

# Where Windows really keeps Documents, even when you've moved it (the DAWs' user folders are there).
[target.'cfg(windows)'.dependencies]
known-folders = "1.4"
