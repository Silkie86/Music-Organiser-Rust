[package]
name = "mo-space"
description = "Space: how much room songs and the app's files take, what could go to free some, and clean-ups that only ever go to the Recycle Bin and can be put back. No UI in it."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono.workspace = true
mo-formats = { path = "../mo-formats" }
mo-library = { path = "../mo-library" }
rayon.workspace = true
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
serde = { version = "1", features = ["derive"] }
# Saves that are byte-for-byte copies are found by their SHA-256, as the C# app finds them.
sha2 = "0.10"
# The Recycle Bin (Windows), the Trash (Mac, Linux): removing to it, and putting things back from it.
trash = "5.2"
# How much room a drive has left.
fs4 = "1.1"

[dev-dependencies]
serde_json = "1"
