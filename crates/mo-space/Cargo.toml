[package]
name = "mo-space"
description = "Space: how much room songs and the app's files take, what could go to free some, and clean-ups that only ever go to the Recycle Bin and can be put back. No UI in it."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono.workspace = true
mo-formats = { path = "../mo-formats" }
mo-library = { path = "../mo-library" }
rayon.workspace = true
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Saves that are byte-for-byte copies are found by their SHA-256, as the C# app finds them.
sha2 = "0.10"
# The Recycle Bin (Windows), the Trash (Mac, Linux): removing to it, and putting things back from it. Held at this
# version: the start-up sweep's notes stop going by themselves on what it says when Windows doesn't move something
# and doesn't say why (5.2.9: an `Unknown` error, "Some operations were aborted"; see `clean::bin_problem`). Before
# updating it, check what the new version says then, and what errors it gives.
trash = "=5.2.9"
# How much room a drive has left.
fs4 = "1.1"

# Where Windows keeps Documents, ProgramData and the rest, even when you've moved them.
[target.'cfg(windows)'.dependencies]
known-folders = "1.4"
# The list of installed programs and their uninstallers (Settings, Apps).
windows-registry = "0.6"
# A junction: the link a moved folder leaves in its place (no administrator rights needed, unlike a symbolic link).
# 1.4.1 or later: putting a link back reads the old one, which Windows gives as a "\\?\" path, and older versions
# made a broken junction from that without saying so.
junction = "1.4.1"
# Which drives are USB sticks or memory cards: Windows keeps no Recycle Bin on them, so nothing there is removed.
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
# Which drive a file is on (and what kind), by the id Windows keeps its Recycle Bin settings under, and how full
# that Recycle Bin is.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell"] }

# Whether a folder is on a network share (Mac, Linux). Already used by fs4.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

