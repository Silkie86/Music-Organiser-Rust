[package]
name = "mo-presets"
description = "The Presets page's engine: every sound made inside a song plus preset files on disk, what each is, and a guess at the part it plays (bass, lead, chords...). No UI in it; it writes only presets.db (your part fixes) and exported presets in the export folder."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mo-formats = { path = "../mo-formats" }
# Serum keeps its settings zlib-packed (the same crate as mo-formats).
flate2 = "1"
rayon.workspace = true
# presets.db: your fixes to the part guess (the same SQLite, built in, as mo-library).
rusqlite = { version = "0.41", features = ["bundled"] }
# A sound's fingerprint, the same on every computer and in every version.
sha2 = "0.10"
# A Bitwig preset keeps its plugin's settings in a zip at its end (the same crate and features as mo-formats).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

