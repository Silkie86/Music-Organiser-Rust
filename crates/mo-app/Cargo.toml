[package]
name = "mo-app"
description = "Every screen's logic and state, with no UI framework in it, so it can be tested without a window."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# What the Space page's clean-ups put in the Recycle Bin, kept in a small file so Put back works after a restart.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono.workspace = true
# Catching a panic on purpose: a damaged file tripping a reader is a warning, not a crash.
mo-catch = { path = "../mo-catch" }
# The backup engine (Space page, Backup) and the sizes and song measures it uses.
mo-backup = { path = "../mo-backup" }
# FL Studio songs converted for Bitwig ("Open in Bitwig").
mo-convert = { path = "../mo-convert" }
# The link to Bitwig: Send to Bitwig from the Sounds page, and Settings › DAWs saying how it stands.
mo-dawlink = { path = "../mo-dawlink" }
mo-formats = { path = "../mo-formats" }
mo-harmony = { path = "../mo-harmony" }
mo-library = { path = "../mo-library" }
mo-midi = { path = "../mo-midi" }
# The Presets page's engine (sounds in songs, preset files, part guesses, export and curves), and the names its files
# are written under while being made, so the start-up sweep (rule 28) knows the half-made ones a crash left.
mo-presets = { path = "../mo-presets" }
mo-sounds = { path = "../mo-sounds" }
mo-space = { path = "../mo-space" }
# Moving the data folder: each copied file checked by its SHA-256, and the room on the new drive.
sha2 = "0.10"
fs4 = "1.1"
thread-priority.workspace = true
rayon.workspace = true
tiny-skia.workspace = true
# The words on the card that follows a drag out of the app (drawn outside Slint, in the app's own fonts). Slint already
# brings it in.
swash = "0.2"

# Long work over a disk is put low in the system's memory (background::on_bulk_pool).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[dev-dependencies]
# A small library made by the backup test.
rusqlite = { version = "0.41", features = ["bundled"] }
# The stand-in Bitwig, for the Send to Bitwig tests: no test reaches a real Bitwig (rule 11).
mo-dawlink = { path = "../mo-dawlink", features = ["fake-bitwig"] }
# The made-up Bitwig projects the Space Fix test writes (mo-formats' test projects pack a part with it).
flate2 = "1"

# Folder links in the backup tests, made the way Windows has them (a junction: no administrator rights needed).
[target.'cfg(windows)'.dev-dependencies]
junction = "1.4.1"
