[package]
name = "mo-app"
description = "Every screen's logic and state, with no UI framework in it, so it can be tested without a window."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = "1"
chrono.workspace = true
# The backup engine (Space page, Backup) and the sizes and song measures it uses.
mo-backup = { path = "../mo-backup" }
# FL Studio songs converted for Bitwig ("Open in Bitwig").
mo-convert = { path = "../mo-convert" }
# The link to Bitwig: Send to Bitwig from the Sounds page.
mo-dawlink = { path = "../mo-dawlink" }
mo-formats = { path = "../mo-formats" }
mo-library = { path = "../mo-library" }
mo-sounds = { path = "../mo-sounds" }
mo-space = { path = "../mo-space" }
thread-priority.workspace = true
rayon.workspace = true
tiny-skia.workspace = true

[dev-dependencies]
# A small library made by the backup test.
rusqlite = { version = "0.41", features = ["bundled"] }
# The stand-in Bitwig, for the Send to Bitwig tests: no test reaches a real Bitwig (rule 11).
mo-dawlink = { path = "../mo-dawlink", features = ["fake-bitwig"] }
