[package]
name = "mo-ui"
description = "The Slint screens, the window shell and main()."
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "music-organiser"

[[bin]]
name = "music-organiser"
path = "src/main.rs"

[[bin]]
name = "mo-screens"
path = "src/bin/mo-screens.rs"

[dependencies]
mo-app.workspace = true
mo-library = { path = "../mo-library" }
mo-formats = { path = "../mo-formats" }
mo-space = { path = "../mo-space" }
mo-sounds = { path = "../mo-sounds" }
mo-audio = { path = "../mo-audio" }
mo-backup = { path = "../mo-backup" }
slint.workspace = true
image.workspace = true
chrono.workspace = true
# The clipboard, for Copy path. Slint already brings it in for its text boxes.
arboard = { version = "3.7", default-features = false }
# The system's folder picker (Backup: Add folder, Pick a drive). On Linux through the desktop portal, no GTK needed.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.dependencies]
# The real Documents folder (it may have moved to OneDrive), for exports.
known-folders = "1.4"

[dev-dependencies]
# Tests make a small song library to read the use counts from.
rusqlite = "0.41"

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true
