[package]
name = "mo-ui"
description = "The Slint screens, the window shell and main()."
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "music-organiser"

[[bin]]
name = "music-organiser"
path = "src/main.rs"

[[bin]]
name = "mo-screens"
path = "src/bin/mo-screens.rs"

[dependencies]
rayon.workspace = true
mo-app.workspace = true
mo-library = { path = "../mo-library" }
mo-harmony = { path = "../mo-harmony" }
mo-midi = { path = "../mo-midi" }
mo-formats = { path = "../mo-formats" }
mo-space = { path = "../mo-space" }
mo-sounds = { path = "../mo-sounds" }
mo-audio = { path = "../mo-audio" }
mo-backup = { path = "../mo-backup" }
# Settings › DAWs checks the Bitwig link.
mo-dawlink = { path = "../mo-dawlink" }
# The window and the views the app draws itself (the galaxy) go through the graphics card with wgpu (spec 9.1).
slint = { workspace = true, features = ["unstable-wgpu-30", "unstable-winit-030", "renderer-femtovg-wgpu"] }
image.workspace = true
chrono.workspace = true
# The clipboard, for Copy path. Slint already brings it in for its text boxes.
arboard = { version = "3.7", default-features = false }
# The system's folder picker (Backup: Add folder, Pick a drive). On Linux through the desktop portal, no GTK needed.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.dependencies]
# The real Documents folder (it may have moved to OneDrive), for exports.
known-folders = "1.4"
# The freeze watchdog looks at where the window's thread is stuck, and at the app's page faults (crate::stuck).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Tests make a small song library to read the use counts from.
rusqlite = "0.41"

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true
