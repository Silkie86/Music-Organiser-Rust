[package]
name = "mo-audio"
description = "Sound files: reads WAV and AIFF (with their ACID and sampler notes) and writes WAV, as the C# app does. Other formats, resampling and playback come next. No UI in it."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# MP3, FLAC, M4A (AAC), OGG (Vorbis) and AAC, decoded in Rust on every system (the C# app needed Windows for these).
symphonia = { version = "0.6", default-features = false, features = ["mp3", "flac", "isomp4", "aac", "ogg", "vorbis"] }
