[package]
name = "mo-audio"
description = "Sound files: reads WAV and AIFF (with their ACID and sampler notes) and writes WAV, as the C# app does. Also MP3, FLAC, M4A, OGG and AAC, and plays sounds for auditioning. No UI in it."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Sound output on every system (WASAPI on Windows, Core Audio on a Mac, ALSA on Linux). Apache-2.0.
cpal = "0.18"
# MP3, FLAC, M4A (AAC), OGG (Vorbis) and AAC, decoded in Rust on every system (the C# app needed Windows for these).
symphonia = { version = "0.6", default-features = false, features = ["mp3", "flac", "isomp4", "aac", "ogg", "vorbis"] }
