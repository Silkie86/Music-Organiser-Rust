[package]
name = "mo-audio"
description = "Sound files: reads WAV and AIFF (with their ACID and sampler notes) and writes WAV, as the C# app does. Also MP3, FLAC, M4A, OGG and AAC (and WMA on Windows), and plays sounds for auditioning. No UI in it."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Sound output on every system (WASAPI on Windows, Core Audio on a Mac, ALSA on Linux). Apache-2.0.
cpal = { version = "0.18", optional = true }
# MP3, FLAC, M4A (AAC), OGG (Vorbis) and AAC, decoded in Rust on every system (the C# app needed Windows for these).
symphonia = { version = "0.6", default-features = false, features = ["mp3", "flac", "isomp4", "aac", "ogg", "vorbis"] }

# WMA, decoded by Windows itself (Media Foundation): there's no WMA decoder written in Rust. MIT or Apache-2.0.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[features]
# Playing sounds (`play`). Crates that only read or analyse sounds leave it out, so they don't need the system's sound
# libraries to build (ALSA's headers on Linux).
default = ["play"]
play = ["dep:cpal"]
