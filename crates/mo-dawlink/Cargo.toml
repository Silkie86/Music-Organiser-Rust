[package]
name = "mo-dawlink"
description = "The app's links to the DAWs: the Music Organiser extension in Bitwig Studio, and Send to Bitwig."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The stand-in Bitwig (`bitwig::fake`), for the tests of the crates that use this one: tests never reach a real DAW
# (rule 11). This crate's own tests always have it.
fake-bitwig = []
# Notes out of the "Music Organiser" MIDI port for FL Studio (`fl::open_port`), through midir. The app turns it on;
# crates that only test the player leave it off, so they don't need the system's MIDI libraries (ALSA's on Linux).
midi-port = ["dep:midir"]

[dependencies]
# File names as the C# app reads them, whichever way the folders are written (`paths::file_name`).
mo-formats = { path = "../mo-formats" }
serde_json = "1"
# The watch feed's thread runs at low priority (rules 12 and 21), as the library's folder watch does.
thread-priority.workspace = true
# MIDI ports on every system (WinMM on Windows, CoreMIDI on a Mac, ALSA on Linux). MIT.
midir = { version = "0.11", optional = true }
# The Bitwig extension is a zip (a Java archive): its version is in its manifest.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
# This crate's own tests (in tests/) use the stand-in Bitwig too.
mo-dawlink = { path = ".", features = ["fake-bitwig"] }
# The kit builder's own pads, to check they land where General MIDI drum parts play (the C# app's test does the same).
mo-sounds = { path = "../mo-sounds" }
