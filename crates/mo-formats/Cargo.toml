[package]
name = "mo-formats"
description = "Reads (and later writes) the DAW project files: FL Studio, Bitwig, Studio One, MIDI. No UI and no library in it."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono.workspace = true
# Bitwig keeps plugin states in a zip at the end of its projects, and some of its older files hold zlib streams.
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Studio One's songs are zips of XML: read with a small, strict parser, after its undeclared "x:" prefixes are taken
# out with two patterns, as the C# reader does.
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
roxmltree = "0.21"
# A map that keeps the order things went in: a project's details, listed as the reader found them.
indexmap = "2"
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
serde_json = "1.0.154"

[dev-dependencies]
# Random Bitwig files and object trees for the round-trip tests (spec 11.2).
proptest = { version = "1", default-features = false, features = ["std"] }
