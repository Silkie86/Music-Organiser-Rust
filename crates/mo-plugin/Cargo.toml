[package]
name = "mo-plugin"
description = "The test CLAP plugin: a small Music Organiser panel inside a DAW (Bitwig first). It opens a Slint panel in the window the DAW lends it, lists sounds from the app's sound library, plays one through the track, and lists every CLAP extension the DAW offers. It reads the app's files and never writes them."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# cdylib: the .clap file a DAW loads (a renamed .dll/.so). rlib: so the tests can use it.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The clipboard, for the DAW check's Copy list (the app's Copy path uses it too).
arboard = { version = "3.7", default-features = false }
chrono.workspace = true
# CLAP itself, through safe Rust wrappers (MIT/Apache). clack-extensions holds every standard extension.
clack-plugin = "0.2"
clack-extensions = { version = "0.2", features = [
    "audio-ports",
    "clack-plugin",
    "gui",
    "log",
    "note-ports",
    "params",
    "preset-discovery",
    "raw-window-handle_06",
    "remote-controls",
    "state",
    "track-info",
] }
# The plugin's own window inside the one the DAW lends it (MIT/Apache).
baseview = "0.4"
# Puts the pixels Slint drew in that window, without the graphics card (Slint's software renderer).
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen"] }
bytemuck = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"
# The keys baseview hands the window, as it names them.
keyboard-types = "0.8"
# The screens: Slint without its own windows (the DAW's window stands in), drawn on the graphics card with wgpu as
# the app's are (`gpu.rs`), or on the CPU when there's no card to draw with.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-software",
    "renderer-femtovg-wgpu",
    "unstable-wgpu-30",
] }
# Only to switch on Slint's reading of the pictures in its own widgets (the list's scroll bar): Slint's window libraries
# switch it on themselves, and the plugin uses none of them. The same version as `slint` in Cargo.lock: update both.
i-slint-core = { version = "=1.18.1", default-features = false, features = ["image-decoders", "svg"] }
# Hands sounds to the audio thread and back without waiting or making memory there.
rtrb = "0.3"
thread-priority.workspace = true
mo-app = { workspace = true }
# Decoding sounds, and MIDI parts played with a SoundFont (`gm`): the DAW plays them, not the system's sound output.
mo-audio = { path = "../mo-audio", default-features = false, features = ["gm", "stretch"] }
mo-catch = { path = "../mo-catch" }
# A MIDI part's notes, as the index hands them.
mo-formats = { path = "../mo-formats" }
# The app's MIDI index, read-only, for the MIDI tab.
mo-midi = { path = "../mo-midi" }
# The library's saves (read-only), whose Bitwig folders the Presets tab looks in.
mo-library = { path = "../mo-library" }
# The preset files and what the app's Presets page kept of them, read-only, for the Presets tab.
mo-presets = { path = "../mo-presets" }
# The galaxy's painter on the graphics card, the one the app draws its Galaxy with.
mo-sky = { path = "../mo-sky" }
mo-sounds = { path = "../mo-sounds" }

[target.'cfg(windows)'.dependencies]
# Dragging a sound out onto a track: Windows' own drag and drop, as mo-ui's lists hand files over.
windows = { version = "0.62", features = [
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# `windows`' `#[implement]` (our side of the drag, which Windows asks how it's going) names this crate itself.
windows-core = "0.62"

[dev-dependencies]
# A stand-in DAW for the tests: clack's host side.
clack-host = { version = "0.2", features = ["clack-plugin"] }
clack-extensions = { version = "0.2", features = [
    "audio-ports",
    "clack-host",
    "gui",
    "note-ports",
    "params",
    "preset-discovery",
    "remote-controls",
    "state",
] }
# The MIDI tab's test makes a small MIDI index of made-up files, as the app's indexer does.
rayon.workspace = true

[build-dependencies]
slint-build.workspace = true
