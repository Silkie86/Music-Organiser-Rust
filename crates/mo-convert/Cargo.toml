[package]
name = "mo-convert"
description = "Converts a song from one DAW to another: FL Studio to Bitwig first. Reads with mo-formats, never changes the song it reads."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mo-formats = { path = "../mo-formats" }
# Bitwig keeps plugin settings in a zip at the end of its projects (as mo-formats reads them).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
# The made-up Bitwig files shared from mo-formats' tests use it.
flate2 = "1"
