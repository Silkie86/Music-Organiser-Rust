[package]
name = "mo-sounds"
description = "Your sound library: reads the C# app's sounds.db (read-only until it's trusted), sound types from names, keys and Camelot codes. Analysis, likeness, Rediscover, kits, duplicates and the galaxy map. No UI in it."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono.workspace = true
# How much room the disk has, so making the compact library never fills it.
fs4 = "1.1"
# Half-precision numbers: CLAP's fingerprints are held at half size (Solomon, 2026-11-03).
half = "2.7"
# Without playing sounds: reading and analysing them needs no sound output.
mo-audio = { path = "../mo-audio", default-features = false }
mo-catch = { path = "../mo-catch" }
mo-formats = { path = "../mo-formats" }
mo-library = { path = "../mo-library" }
rayon.workspace = true
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
# SQLite, built into the app, so nothing has to be installed beside it.
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Prints of sounds' audio, to find real copies (copies.rs).
sha2 = "0.10"
