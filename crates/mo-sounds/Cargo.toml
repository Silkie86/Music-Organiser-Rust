[package]
name = "mo-sounds"
description = "Your sound library: reads the C# app's sounds.db (read-only until it's trusted), sound types from names, keys and Camelot codes. Analysis, duplicates and the galaxy layout come later. No UI in it."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono.workspace = true
mo-audio = { path = "../mo-audio" }
mo-formats = { path = "../mo-formats" }
mo-library = { path = "../mo-library" }
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
# SQLite, built into the app, so nothing has to be installed beside it.
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
