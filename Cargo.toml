[workspace]
resolver = "3"
members = ["crates/*", "tools/formatlab", "tools/miditwin", "tools/twin"]
# The galaxy check is a workspace of its own, so its wgpu never gets mixed into the app's build.
exclude = ["tools/galaxycheck"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Silkie86/Music-Organiser-Rust"
publish = false

[workspace.dependencies]
mo-app = { path = "crates/mo-app" }
slint = "1.18"
slint-build = "1.18"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
thread-priority = "3.1"
rayon = "1.11"

[workspace.lints.rust]
# Deny, not forbid: the code Slint generates allows it locally.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A file the app reads can be damaged in any way, so nothing outside tests may stop the app with unwrap or expect: say
# what's wrong instead. Tests may: clippy.toml allows them in #[test] functions and test modules, and each file in a
# crate's tests folder allows them at its top.
unwrap_used = "deny"
expect_used = "deny"

# Release builds stop on arithmetic that overflows, as test builds do, rather than going on with a wrong number.
[profile.release]
overflow-checks = true

# Dependencies get optimised once and then cached, so the app stays quick to rebuild but doesn't crawl when run.
[profile.dev.package."*"]
opt-level = 2
