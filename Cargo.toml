[workspace]
resolver = "3"
members = ["crates/*", "tools/formatlab", "tools/miditwin", "tools/theorybench", "tools/twin"]
# The galaxy check is a workspace of its own, so its wgpu never gets mixed into the app's build.
# The fuzzer (fuzz/) is one too: it's built with nightly Rust by cargo-fuzz.
# vendor/femtovg is a patched copy of a library (below), not one of the app's own crates.
exclude = ["tools/galaxycheck", "fuzz", "vendor/femtovg"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Silkie86/Music-Organiser-Rust"
publish = false

[workspace.dependencies]
mo-app = { path = "crates/mo-app" }
slint = "1.18"
slint-build = "1.18"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
thread-priority = "3.1"
rayon = "1.11"
# Draws the custom views (arrangement, later the piano roll and waveforms) on the CPU.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

# Slint's drawing library, with one fix: it kept rebuilding its graphics card steps on every frame
# (vendor/femtovg/PATCHED.md says what and when to remove it).
[patch.crates-io]
femtovg = { path = "vendor/femtovg" }

[workspace.lints.rust]
# Deny, not forbid: the code Slint generates allows it locally.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A file the app reads can be damaged in any way, so nothing outside tests may stop the app with unwrap or expect: say
# what's wrong instead. Tests may: clippy.toml allows them in #[test] functions and test modules, and each file in a
# crate's tests folder allows them at its top.
unwrap_used = "deny"
expect_used = "deny"

# Release builds stop on arithmetic that overflows, as test builds do, rather than going on with a wrong number.
[profile.release]
overflow-checks = true

# Debug builds (the launcher's, the tests') keep only file names and line numbers for their debugging info: all a
# crash log needs to say where it happened. Full debugging info made the build folder several times bigger, and the
# launcher's one grew by gigabytes on Solomon's C: drive.
[profile.dev]
debug = "line-tables-only"

# Dependencies get optimised once and then cached, so the app stays quick to rebuild but doesn't crawl when run.
[profile.dev.package."*"]
opt-level = 2

# The screens' logic too: the launcher runs a debug build, and the Sounds page's galaxy draws half a million stars,
# which unoptimised code is too slow for. (mo-ui itself stays quick to build: its Slint code is most of the time.)
[profile.dev.package.mo-app]
opt-level = 2

# And the crates under it: the library reads 16,000 saves and groups them into songs, the sounds read half a million
# rows, and unoptimised they took a minute or more on start. Only mo-ui stays unoptimised.
[profile.dev.package.mo-audio]
opt-level = 2

[profile.dev.package.mo-backup]
opt-level = 2

[profile.dev.package.mo-convert]
opt-level = 2

[profile.dev.package.mo-formats]
opt-level = 2

[profile.dev.package.mo-harmony]
opt-level = 2

[profile.dev.package.mo-library]
opt-level = 2

[profile.dev.package.mo-midi]
opt-level = 2

[profile.dev.package.mo-presets]
opt-level = 2

[profile.dev.package.mo-sounds]
opt-level = 2

[profile.dev.package.mo-space]
opt-level = 2

# The build Solomon gets in the end (`cargo build --profile dist --bin music-organiser`, made in `target\dist`): a
# release build, linked as one piece so the linker can drop code nothing uses and join the rest. Measured on main
# (Windows, 2026-11-05): 71 MB down to 49 MB, and no slower to run. It takes about twice as long to build, so the
# launcher's release builds and the twin tests keep the quicker plain release build. Not here, on purpose:
# `panic = "abort"` (mo-catch must catch panics, so a damaged file doesn't close the app), `strip` (on Windows it
# would drop the .pdb that lets a crash log say where it happened) and `opt-level = "s"` (35 MB, but slower code).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
