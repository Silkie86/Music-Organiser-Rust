[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Silkie86/Music-Organiser-Rust"
publish = false

[workspace.dependencies]
mo-app = { path = "crates/mo-app" }
slint = "1.18"
slint-build = "1.18"
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
# Deny, not forbid: the code Slint generates allows it locally.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies get optimised once and then cached, so the app stays quick to rebuild but doesn't crawl when run.
[profile.dev.package."*"]
opt-level = 2
